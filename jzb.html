            min-height: 100vh;
            padding: 8px;
            padding-bottom: 12px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 20px;
            text-align: center;
        }

        .book-selector {
            margin: 0;
        }

        .book-selector select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
        }

        .book-selector select option {
            background: #667eea;
            color: white;
        }

        .search-section {
            padding: 5px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .search-item {
            flex: 1;
            min-width: 0;
        }

        .search-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .search-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
            display: block;
            white-space: nowrap;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 12px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .sort-buttons {
            display: flex;

            gap: 4px;
        }

        .sort-btn {
            border: 1px solid #e0e3ff;
            background: #f1f3ff;
            color: #667eea;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .sort-btn.active {
            background: #667eea;
            color: #ffffff;
        }

        .stats {
            padding: 5px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
            font-size: 14px;
            color: #495057;
        }

        .stats-text {
            line-height: 1.5;
        }

        .stat-highlight {
            color: #667eea;
            font-weight: bold;
            font-size: 15px;
        }

        .records-section {
            padding: 10px 16px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .record-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .record-name {
            font-size: 16px;
            font-weight: 500;
            color: #212529;
        }

        .record-amount {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .no-results {
            text-align: center;
            padding: 30px 20px;
            color: #6c757d;
            font-size: 16px;
        }

        .book-info {
            display: none;
        }

        /* 滚动条样式 */
        .records-section::-webkit-scrollbar {
            width: 6px;
        }

        .records-section::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .records-section::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .records-section::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
    </style>
</head>

        let currentBookIndex = 0;

        // DOM 元素
        const bookSelect = document.getElementById('bookSelect');
        const bookInfo = document.getElementById('bookInfo');
        const nameSearchInput = document.getElementById('nameSearchInput');
        const amountSearchInput = document.getElementById('amountSearchInput');
        const recordsSection = document.getElementById('recordsSection');
        const totalCountEl = document.getElementById('totalCount');
        const totalAmountEl = document.getElementById('totalAmount');
        const statsTextEl = document.getElementById('statsText');
        const sortButtons = document.querySelectorAll('.sort-btn');

        // 初始化
        function init() {
            loadBook(currentBookIndex);
            setupEventListeners();
        }

        // 设置事件监听
        function setupEventListeners() {
            // 账本切换
            bookSelect.addEventListener('change', (e) => {
                currentBookIndex = parseInt(e.target.value);
                loadBook(currentBookIndex);
                nameSearchInput.value = '';
                amountSearchInput.value = '';
                filterRecords();
            });

            // 姓名搜索输入
            nameSearchInput.addEventListener('input', () => {
                filterRecords();
            });

            // 金额搜索输入
            amountSearchInput.addEventListener('input', () => {
                filterRecords();
            });

            // 金额排序按钮
            sortButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.dataset.dir;
                    if (currentSortDirection === dir) {
                        // 再次点击同一个按钮，取消排序
                        currentSortDirection = 'none';
                        sortButtons.forEach(b => b.classList.remove('active'));
                    } else {
                        currentSortDirection = dir;
                        sortButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    }
                    filterRecords();
                });
            });
        }

        // 加载账本
        function loadBook(index) {
            const book = accountBooks[index];
            bookInfo.textContent = book.name;
            filteredRecords = [...book.records];
            displayRecords();
            updateStats();
        }

        // 过滤记录
        function filterRecords() {
            const book = accountBooks[currentBookIndex];
            const nameQuery = nameSearchInput.value.trim();
            const amountQuery = amountSearchInput.value.trim();

            let results = [...book.records];

            // 姓名模糊搜索
            if (nameQuery) {
                results = results.filter(record =>
                    record.name.includes(nameQuery)
                );
            }

            // 金额精确搜索
            if (amountQuery) {
                const amount = parseFloat(amountQuery);
                if (!isNaN(amount)) {
                    results = results.filter(record =>
                        record.amount === amount
                    );
                } else {
                    results = [];
                }
            }

            // 金额排序
            if (currentSortDirection === 'asc') {
                results.sort((a, b) => a.amount - b.amount);
            } else if (currentSortDirection === 'desc') {
                results.sort((a, b) => b.amount - a.amount);
            }

            filteredRecords = results;
            displayRecords();
            updateStats();
        }

        // 显示记录
        function displayRecords() {
            if (filteredRecords.length === 0) {
                recordsSection.innerHTML = '<div class="no-results">暂无匹配的记录</div>';
                return;
            }

            recordsSection.innerHTML = filteredRecords
                .map(record =>record.note ? `
                    <div class="record-item">
                        <div class="record-name">${record.name}(${record.note})</div>
                        <div class="record-amount">${record.amount}元</div>
                    </div>
                `: `
                    <div class="record-item">
                        <div class="record-name">${record.name}</div>
                        <div class="record-amount">${record.amount}元</div>
                    </div>
                `)
                .join('');
        }

        // 更新统计信息
        function updateStats() {
            const book = accountBooks[currentBookIndex];
            const totalCount = book.records.length;
            const totalAmount = book.records.reduce((sum, record) => sum + record.amount, 0);

            totalCountEl.textContent = totalCount;
            totalAmountEl.textContent = totalAmount.toFixed(2);
        }

        // 启动应用
        init();
    </script>
