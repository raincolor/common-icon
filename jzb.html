<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>亲友礼金记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 8px;
            padding-bottom: 12px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            max-height: calc(100vh - 20px);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 14px;
            text-align: center;
            flex-shrink: 0;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .book-selector {
            margin: 0;
            flex: 1 1 100%;
        }

        .book-selector select {
            width: 100%;
            padding: 8px 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
        }

        .book-selector select option {
            background: #667eea;
            color: white;
        }

        .header-action-btn {
            border: none;
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            flex: 1 1 calc(50% - 4px);
        }

        .header-action-btn:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .search-section {
            padding: 4px 14px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .search-item {
            flex: 1;
            min-width: 0;
        }

        .search-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .search-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
            display: block;
            white-space: nowrap;
        }

        .search-input-wrap {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 32px 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 12px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #c0c4cc;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.2s;
            z-index: 2;
        }

        .clear-btn:hover {
            background: #909399;
        }

        .clear-btn.visible {
            display: flex;
        }

        .sort-buttons {
            display: flex;

            gap: 4px;
        }

        .sort-btn {
            border: 1px solid #e0e3ff;
            background: #f1f3ff;
            color: #667eea;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .sort-btn.active {
            background: #667eea;
            color: #ffffff;
        }

        .stats {
            padding: 4px 14px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
            font-size: 14px;
            color: #495057;
            flex-shrink: 0;
        }

        .stats-text {
            line-height: 1.5;
        }

        .book-type-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1;
            vertical-align: middle;
        }

        .book-type-badge.income {
            background: #ecfdf3;
            color: #1f7a45;
        }

        .book-type-badge.expense {
            background: #fff1f0;
            color: #cf1322;
        }

        .stat-highlight {
            color: #667eea;
            font-weight: bold;
            font-size: 15px;
        }

        .records-section {
            padding: 8px 14px 10px;
            max-height: none;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .record-toolbar {
            padding: 6px 14px 0;
            background: #fff;
            flex-shrink: 0;
        }

        .primary-action-btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            background: #667eea;
            color: #fff;
        }

        .primary-action-btn:hover {
            background: #5568d3;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 5px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
            gap: 10px;
        }

        .record-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .record-name {
            font-size: 16px;
            font-weight: 800;
            color: #06874f;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .view-all-btn {
            border: 1px solid #e0e3ff;
            background: #f1f3ff;
            color: #667eea;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .view-all-btn:hover {
            background: #e6e9ff;
        }

        .record-note {
            font-size: 14px;
            color: #399806;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .record-note-type {
            font-size: 12px;
            color: #6c757d;
            white-space: nowrap;
        }

        .record-amount {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .record-main {
            flex: 1;
            min-width: 0;
        }

        .record-side {
            min-width: 110px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .record-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .record-action-btn {
            border: 1px solid #d9ddff;
            background: #fff;
            color: #667eea;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .record-action-btn:hover {
            background: #f5f7ff;
        }

        .record-action-btn.danger {
            border-color: #ffd1cf;
            color: #cf1322;
        }

        .record-action-btn.success {
            border-color: #b7ebc6;
            color: #1f7a45;
        }

        .record-edit-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .record-edit-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .record-edit-label {
            font-size: 12px;
            color: #6c757d;
        }

        .record-edit-input {
            width: 100%;
            border: 1px solid #d9dfe7;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
        }

        .record-edit-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .expense-record {
            border-left-color: #ff7875;
        }

        .expense-record .record-name {
            color: #a8071a;
        }

        .expense-record .record-amount {
            color: #e55353;
        }

        .no-results {
            text-align: center;
            padding: 30px 20px;
            color: #6c757d;
            font-size: 16px;
        }

        .book-info {
            display: none;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 9999;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            color: #495057;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            background: #fff;
            cursor: pointer;
            color: #6c757d;
            font-size: 16px;
            line-height: 26px;
        }

        .modal-close:hover {
            background: #f1f3f5;
        }

        .modal-body {
            max-height: min(70vh, 520px);
            overflow: auto;
            padding: 12px 14px 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #495057;
        }

        .form-input,
        .form-select {
            width: 100%;
            border: 1px solid #d9dfe7;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 8px;
        }

        .modal-btn {
            border: none;
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-btn.primary {
            background: #667eea;
            color: #fff;
        }

        .modal-btn.secondary {
            background: #f1f3f5;
            color: #495057;
        }

        .modal-btn.danger {
            background: #fff1f0;
            color: #cf1322;
        }

        .modal-btn.hidden {
            display: none;
        }

        .batch-row-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .batch-row {
            display: grid;
            grid-template-columns: 1.2fr 1.4fr 0.9fr 42px;
            gap: 8px;
            align-items: center;
        }

        .batch-input {
            width: 100%;
            border: 1px solid #d9dfe7;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
        }

        .batch-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: 1px solid #ffd1cf;
            border-radius: 10px;
            background: #fff5f5;
            color: #cf1322;
            cursor: pointer;
        }

        .add-row-btn {
            width: 100%;
            border: 1px dashed #667eea;
            border-radius: 10px;
            padding: 10px 12px;
            background: #f7f8ff;
            color: #667eea;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .toast-container {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            min-width: 180px;
            max-width: 80vw;
            padding: 10px 14px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            font-size: 13px;
        }

        .toast.success {
            background: rgba(31, 122, 69, 0.95);
        }

        .toast.error {
            background: rgba(207, 19, 34, 0.95);
        }

        .toast.info {
            background: rgba(72, 91, 236, 0.95);
        }

        .modal-empty {
            text-align: center;
            color: #6c757d;
            padding: 24px 8px;
        }

        .modal-book {
            margin-bottom: 10px;
            border: 1px solid #eef0f2;
            border-radius: 10px;
            overflow: hidden;
        }

        .modal-book-name {
            padding: 8px 10px;
            background: #f6f7ff;
            color: #667eea;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-top: 1px solid #f0f1f3;
            font-size: 13px;
            color: #495057;
        }

        .modal-row-note {
            color: #6c757d;
            font-size: 12px;
        }

        .modal-direction {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            padding: 1px 6px;
            margin-right: 6px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .modal-direction.income {
            background: #ecfdf3;
            color: #1f7a45;
        }

        .modal-direction.expense {
            background: #fff1f0;
            color: #cf1322;
        }

        /* 滚动条样式 */
        .records-section::-webkit-scrollbar {
            width: 6px;
        }

        .records-section::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .records-section::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .records-section::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-tools">
                <div class="book-selector">
                    <select id="bookSelect"></select>
                </div>
                <button type="button" class="header-action-btn" id="addBookBtn">新增大类</button>
                <button type="button" class="header-action-btn" id="editBookBtn">编辑当前</button>
            </div>
        </div>

        <div class="book-info" id="bookInfo">
            2025年4月6日 曾希沅百日宴
        </div>

        <div class="search-section">
            <div class="search-box">
                <div class="search-item">
                    <label class="search-label">输入姓名/备注模糊搜索</label>
                    <div class="search-input-wrap">
                        <input type="text" id="nameSearchInput" class="search-input" placeholder="姓名或备注包含的字...">
                        <button type="button" class="clear-btn" id="nameClearBtn" aria-label="清除姓名或备注输入">✕</button>
                    </div>
                </div>
                <div class="search-item">
                    <div class="search-label-row">
                        <label class="search-label">输入金额搜索</label>
                        <div class="sort-buttons">
                            <button type="button" class="sort-btn" data-dir="asc">升序</button>
                            <button type="button" class="sort-btn" data-dir="desc">降序</button>
                        </div>
                    </div>
                    <div class="search-input-wrap">
                        <input type="text" id="amountSearchInput" class="search-input" placeholder="输入金额...">
                        <button type="button" class="clear-btn" id="amountClearBtn" aria-label="清除金额输入">✕</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stats-text" id="statsText">
                总计 <span class="stat-highlight" id="totalCount">0</span> 位亲友参加，收到 <span class="stat-highlight"
                    id="totalAmount">0</span> 元
            </div>
        </div>

        <div class="record-toolbar">
            <button type="button" class="primary-action-btn" id="addRecordBtn">新增礼金详情</button>
        </div>

        <div class="records-section" id="recordsSection">
            <!-- 记录将在这里动态生成 -->
        </div>
    </div>

    <!-- 查看所有记录弹窗 -->
    <div class="modal-overlay" id="allRecordsModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal" role="document">
            <div class="modal-header">
                <div class="modal-title" id="allRecordsModalTitle">全部记录</div>
                <button type="button" class="modal-close" id="allRecordsModalClose" aria-label="关闭">✕</button>
            </div>
            <div class="modal-body" id="allRecordsModalBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="bookModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal" role="document">
            <div class="modal-header">
                <div class="modal-title" id="bookModalTitle">新增礼金大类</div>
                <button type="button" class="modal-close" id="bookModalClose" aria-label="关闭">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="bookNameInput">大类名称</label>
                    <input type="text" id="bookNameInput" class="form-input" placeholder="请输入大类名称">
                </div>
                <div class="form-group">
                    <label class="form-label" for="bookTypeSelect">类型</label>
                    <select id="bookTypeSelect" class="form-select">
                        <option value="income">收礼</option>
                        <option value="expense">送礼</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="modal-btn danger hidden" id="deleteBookBtn">删除当前</button>
                    <button type="button" class="modal-btn secondary" id="bookModalCancel">取消</button>
                    <button type="button" class="modal-btn primary" id="bookModalConfirm">确定</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="recordBatchModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal" role="document">
            <div class="modal-header">
                <div class="modal-title" id="recordBatchModalTitle">批量新增礼金详情</div>
                <button type="button" class="modal-close" id="recordBatchModalClose" aria-label="关闭">✕</button>
            </div>
            <div class="modal-body">
                <div class="batch-row-list" id="recordBatchRows"></div>
                <button type="button" class="add-row-btn" id="recordBatchAddRowBtn">+ 再新增一行</button>
                <div class="modal-footer">
                    <button type="button" class="modal-btn secondary" id="recordBatchCancel">取消</button>
                    <button type="button" class="modal-btn primary" id="recordBatchConfirm">确定新增</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[m]));
        }

        // 所有默认数据和接口数据统一在这里补齐 id，后面增删改查都基于稳定 id 进行
        // id 缩短到 8 位，进一步减少入库存储体积；旧数据里的长 id 仍然兼容
        function randomId(length = 8) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
            const cryptoApi = window.crypto || window.msCrypto;
            if (cryptoApi && cryptoApi.getRandomValues) {
                const values = new Uint32Array(length);
                cryptoApi.getRandomValues(values);
                return Array.from(values, value => chars[value % chars.length]).join('').slice(0, length);
            }
            let result = '';
            while (result.length < length) {
                result += Math.random().toString(36).slice(2);
            }
            return result.slice(0, length);
        }

            return {

            return {
                id: book?.id || randomId(),
                name: String(book?.name || '').trim(),
                type: getBookType(book),
                records: Array.isArray(book?.records) ? book.records.map(normalizeRecord) : []

            const res = [];
            accountBooks.forEach((book, bookIndex) => {

        async function requestJson(url, options = {}) {
            const method = options.method || 'GET';
            const params = options.params || null;
            const data = options.data;
            let finalUrl = url;

            if (params) {
                const searchParams = new URLSearchParams();
                Object.keys(params).forEach((key) => {
                    const value = params[key];
                    if (value !== undefined && value !== null && value !== '') {
                        searchParams.append(key, value);
                    }
                });
                const queryString = searchParams.toString();
                if (queryString) {
                    finalUrl += `${finalUrl.includes('?') ? '&' : '?'}${queryString}`;
                }
            }

            const fetchOptions = {
                method,
                headers: {
                    'Accept': 'application/json'
                }
            };

            if (method !== 'GET' && data !== undefined) {
                fetchOptions.headers['Content-Type'] = 'application/json;charset=UTF-8';
                fetchOptions.body = JSON.stringify(data);
            }

            const response = await fetch(finalUrl, fetchOptions);
            const responseText = await response.text();
            const json = safeJsonParse(responseText);

            if (!response.ok) {
                const message = json?.message || json?.msg || responseText || `请求失败（${response.status}）`;
                throw new Error(message);
            }

            // 除了 HTTP 状态，还要拦截业务返回码
            if (json && typeof json === 'object' && 'code' in json && Number(json.code) !== 200) {
                const message = json?.message || json?.msg || `接口返回异常，code=${json.code}`;
                throw new Error(message);
            }

            return json;
        }

        // 金额压缩：存储时按 100 元为 1 单位，读取时再乘回来
        function encodeAmount(amount) {
            return Number(((Number(amount) || 0) / STORAGE_AMOUNT_SCALE).toFixed(2));
        }

        function decodeAmount(amount, scale = STORAGE_AMOUNT_SCALE) {
            return Number(((Number(amount) || 0) * scale).toFixed(2));
        }

        // 第二层压缩：把大量重复出现的姓名/备注抽成字典表，只在记录里存下标
        function collectStringStats(books) {
            const nameCounter = new Map();
            const noteCounter = new Map();

            books.forEach(book => {
                (book.records || []).forEach(record => {
                    const name = String(record.name || '').trim();
                    const note = String(record.note || '').trim();

                    if (name) {
                        nameCounter.set(name, (nameCounter.get(name) || 0) + 1);
                    }
                    if (note) {
                        noteCounter.set(note, (noteCounter.get(note) || 0) + 1);
                    }
                });
            });

            return { nameCounter, noteCounter };
        }

        function buildDictionary(counter) {
            const list = [];
            const indexMap = new Map();

            counter.forEach((count, text) => {
                // 只压缩重复出现的字符串，避免唯一值反而越压越大
                if (!text || count < 2) return;
                indexMap.set(text, list.length);
                list.push(text);
            });

            return { list, indexMap };
        }

        function encodeByDictionary(text, dictionaryMap) {
            const value = String(text || '').trim();
            if (!value) return '';
            if (dictionaryMap.has(value)) {
                return dictionaryMap.get(value);
            }
            return value;
        }

        // 记录压缩：结构为 [id, nameOrNameIndex, amountDiv100, noteOrNoteIndex?]
        function encodeRecord(record, dictionaries) {
            const row = [
                record.id || randomId(),
                encodeByDictionary(record.name, dictionaries.nameMap),
                encodeAmount(record.amount)
            ];
            const note = String(record.note || '').trim();
            if (note) {
                row.push(encodeByDictionary(note, dictionaries.noteMap));
            }
            return row;
        }

        function decodeRecord(rawRecord, dictionaries = {}, scale = STORAGE_AMOUNT_SCALE) {
            if (Array.isArray(rawRecord)) {
                const rawName = rawRecord[1];
                const rawNote = rawRecord[3];

                return normalizeRecord({
                    id: rawRecord[0] || randomId(),
                    name: typeof rawName === 'number' ? (dictionaries.nameList?.[rawName] || '') : (rawName || ''),
                    amount: decodeAmount(rawRecord[2], scale),
                    note: typeof rawNote === 'number' ? (dictionaries.noteList?.[rawNote] || '') : (rawNote || '')
                });
            }

            // 兼容旧格式对象记录
            return normalizeRecord(rawRecord);
        }

        // 账本压缩：收礼默认不存 type，只在送礼时写 1
        // income -> [id, name, records]
        // expense -> [id, name, 1, records]
        function encodeBook(book, dictionaries) {
            const records = (book.records || []).map(record => encodeRecord(record, dictionaries));
            if (getBookType(book) === 'expense') {
                return [
                    book.id || randomId(),
                    String(book.name || '').trim(),
                    1,
                    records
                ];
            }
            return [
                book.id || randomId(),
                String(book.name || '').trim(),
                records
            ];
        }

        function decodeBook(rawBook, dictionaries = {}, scale = STORAGE_AMOUNT_SCALE) {
            if (Array.isArray(rawBook)) {
                const hasTypeFlag = !Array.isArray(rawBook[2]);
                const records = hasTypeFlag ? rawBook[3] : rawBook[2];
                return normalizeBook({
                    id: rawBook[0] || randomId(),
                    name: rawBook[1] || '',
                    type: hasTypeFlag && Number(rawBook[2]) === 1 ? 'expense' : 'income',
                    records: Array.isArray(records) ? records.map(record => decodeRecord(record, dictionaries, scale)) : []
                });
            }

            // 兼容可能存在的上一版短字段对象格式
            if (rawBook && Array.isArray(rawBook.r)) {
                return normalizeBook({
                    id: rawBook.i || randomId(),
                    name: rawBook.n || '',
                    type: rawBook.t === 'e' || rawBook.t === 1 ? 'expense' : 'income',
                    records: rawBook.r.map(record => decodeRecord(record, dictionaries, scale))
                });
            }

            // 兼容旧格式对象账本
            return normalizeBook({
                ...rawBook,
                records: Array.isArray(rawBook?.records) ? rawBook.records.map(decodeRecord) : []
            });
        }

        function extractStoredContent(response) {
            const candidates = [
                response?.data?.content,
                response?.content,
                response?.data,
                response
            ];

            for (const candidate of candidates) {
                let parsed = candidate;
                if (typeof parsed === 'string') {
                    parsed = safeJsonParse(parsed);
                }
                if (!parsed) continue;

                // 新压缩格式：{ v, m, dn, dt, b: [...] }
                if (parsed && Array.isArray(parsed.b)) {
                    const dictionaries = {
                        nameList: Array.isArray(parsed.dn) ? parsed.dn : [],
                        noteList: Array.isArray(parsed.dt) ? parsed.dt : []
                    };
                    const scale = Number(parsed.m) || STORAGE_AMOUNT_SCALE;
                    return {
                        books: parsed.b.map(book => decodeBook(book, dictionaries, scale))
                    };
                }

                if (Array.isArray(parsed)) {
                    return { books: parsed.map(decodeBook) };
                }
                if (Array.isArray(parsed.books)) {
                    return {
                        ...parsed,
                        books: parsed.books.map(decodeBook)
                    };
                }
            }

            return null;
        }

        function buildStorageContent(books) {
            const { nameCounter, noteCounter } = collectStringStats(books);
            const nameDictionary = buildDictionary(nameCounter);
            const noteDictionary = buildDictionary(noteCounter);

            return {
                // v: 版本，m: 金额倍率，u: 更新时间，dn/dt: 字典表，b: 压缩后的 books
                v: 3,
                m: STORAGE_AMOUNT_SCALE,
                u: Date.now(),
                ...(nameDictionary.list.length ? { dn: nameDictionary.list } : {}),
                ...(noteDictionary.list.length ? { dt: noteDictionary.list } : {}),
                b: books.map(book => encodeBook(book, {
                    nameMap: nameDictionary.indexMap,
                    noteMap: noteDictionary.indexMap
                }))
            };
        }

        async function hydrateBooksFromRemote() {
            try {
                const previousBookId = getCurrentBook()?.id || '';
                const response = await requestJson(QUERY_CACHE_URL, {
                    method: 'GET',
                    params: { key: LEDGER_STORAGE_KEY }
                });
                const storedContent = extractStoredContent(response);
                if (!storedContent || !Array.isArray(storedContent.books) || storedContent.books.length === 0) {
                    applyLocalDefaultBooks(previousBookId);
                    showToast('未查询到云端数据，已使用本地默认值', 'info');
                    return;
                }

                accountBooks = normalizeBooks(storedContent.books);
                const matchedIndex = accountBooks.findIndex(book => book.id === previousBookId);
                currentBookIndex = matchedIndex >= 0 ? matchedIndex : 0;
                renderBookOptions();
                loadBook(currentBookIndex);
                filterRecords();
                showToast('已加载云端账本数据', 'success');
            } catch (error) {
                console.error(error);
                applyLocalDefaultBooks(getCurrentBook()?.id || '');
                showToast('云端数据加载失败，已继续使用默认值', 'error');
            }
        }

        async function saveAllBooks(nextBooks, successMessage, nextIndex = currentBookIndex) {
            const normalizedBooks = normalizeBooks(nextBooks);
            const content = buildStorageContent(normalizedBooks);
            await requestJson(SAVE_CACHE_URL, {
                method: 'POST',
                data: {
                    key: LEDGER_STORAGE_KEY,
                    content: JSON.stringify(content)
                }
            });

            accountBooks = normalizedBooks;
            currentBookIndex = clampIndex(nextIndex, accountBooks.length);
            resetEditingState();
            renderBookOptions();
            loadBook(currentBookIndex);
            filterRecords();
            showToast(successMessage, 'success');
        }

        async function submitBookModal() {
            const bookName = bookNameInput.value.trim();
            const bookType = bookTypeSelect.value === 'expense' ? 'expense' : 'income';

            if (!bookName) {
                showToast('大类名称不能为空', 'error');
                bookNameInput.focus();
                return;
            }

            const nextBooks = cloneData(accountBooks);

            try {
                if (currentBookModalMode === 'edit') {
                    const currentBook = nextBooks[currentBookIndex];
                    if (!currentBook) {
                        showToast('当前大类不存在', 'error');
                        return;
                    }
                    currentBook.name = bookName;
                    currentBook.type = bookType;
                    await saveAllBooks(nextBooks, '大类修改成功', currentBookIndex);
                } else {
                    nextBooks.push({
                        id: randomId(),
                        name: bookName,
                        type: bookType,
                        records: []
                    });
                    await saveAllBooks(nextBooks, '大类新增成功', nextBooks.length - 1);
                }
                closeBookModal();
            } catch (error) {
                console.error(error);
                showToast(error.message || '保存大类失败', 'error');
            }
        }

        async function deleteCurrentBook() {
            const currentBook = getCurrentBook();
            if (!currentBook) {
                showToast('当前没有可删除的大类', 'error');
                return;
            }

            const confirmed = window.confirm(`确定删除大类“${currentBook.name}”吗？删除后其中的礼金明细也会一起删除。`);
            if (!confirmed) return;

            const nextBooks = cloneData(accountBooks).filter((_, index) => index !== currentBookIndex);

            try {
                await saveAllBooks(nextBooks, '大类删除成功', currentBookIndex - 1);
                closeBookModal();
            } catch (error) {
                console.error(error);
                showToast(error.message || '删除大类失败', 'error');
            }
        }

        function collectBatchRecords() {
            const rows = Array.from(recordBatchRows.querySelectorAll('.batch-row'));
            const records = [];

            for (let index = 0; index < rows.length; index += 1) {
                const row = rows[index];
                const name = row.querySelector('[data-field="name"]').value.trim();
                const note = row.querySelector('[data-field="note"]').value.trim();
                const amountValue = row.querySelector('[data-field="amount"]').value.trim();

                // 整行都空时直接跳过，方便批量新增时留空备用
                if (!name && !note && !amountValue) {
                    continue;
                }

                if (!name) {
                    throw new Error(`第 ${index + 1} 行名称不能为空`);
                }

                const amount = amountValue === '' ? 0 : Number(amountValue);
                if (Number.isNaN(amount)) {
                    throw new Error(`第 ${index + 1} 行金额格式不正确`);
                }

                records.push({
                    id: randomId(),
                    name,
                    note,
                    amount
                });
            }

            return records;
        }

        async function submitBatchRecords() {
            const currentBook = getCurrentBook();
            if (!currentBook) {
                showToast('当前没有可新增的礼金大类', 'error');
                return;
            }

            try {
                const newRecords = collectBatchRecords();
                if (newRecords.length === 0) {
                    showToast('请至少填写一条有效记录', 'error');
                    return;
                }

                const nextBooks = cloneData(accountBooks);
                nextBooks[currentBookIndex].records.push(...newRecords);
                await saveAllBooks(nextBooks, `${getBookType(currentBook) === 'expense' ? '送礼' : '收礼'}详情新增成功`, currentBookIndex);
                closeRecordBatchModal();
            } catch (error) {
                console.error(error);
                showToast(error.message || '新增详情失败', 'error');
            }
        }

        function startRecordEdit(recordId) {
            editingRecordId = recordId;
            displayRecords();
        }

        function cancelRecordEdit() {
            editingRecordId = '';
            displayRecords();
        }

        async function submitRecordEdit(recordId, recordItemEl) {
            const name = recordItemEl.querySelector('[data-edit-field="name"]').value.trim();
            const note = recordItemEl.querySelector('[data-edit-field="note"]').value.trim();
            const amountValue = recordItemEl.querySelector('[data-edit-field="amount"]').value.trim();

            if (!name) {
                showToast('名称不能为空', 'error');
                return;
            }

            const amount = amountValue === '' ? 0 : Number(amountValue);
            if (Number.isNaN(amount)) {
                showToast('金额格式不正确', 'error');
                return;
            }

            const nextBooks = cloneData(accountBooks);
            const currentBook = nextBooks[currentBookIndex];
            const targetIndex = currentBook.records.findIndex(record => record.id === recordId);
            if (targetIndex < 0) {
                showToast('未找到需要修改的记录', 'error');
                return;
            }

            currentBook.records[targetIndex] = {
                ...currentBook.records[targetIndex],
                name,
                note,
                amount
            };

            try {
                await saveAllBooks(nextBooks, '礼金记录修改成功', currentBookIndex);
                editingRecordId = '';
            } catch (error) {
                console.error(error);
                showToast(error.message || '修改失败', 'error');
            }
        }

        async function deleteRecord(recordId) {
            const currentBook = getCurrentBook();
            if (!currentBook) return;

            const targetRecord = currentBook.records.find(record => record.id === recordId);
            if (!targetRecord) {
                showToast('未找到需要删除的记录', 'error');
                return;
            }

            const confirmed = window.confirm(`确定删除“${targetRecord.name}”这条记录吗？`);
            if (!confirmed) return;

            const nextBooks = cloneData(accountBooks);
            nextBooks[currentBookIndex].records = nextBooks[currentBookIndex].records.filter(record => record.id !== recordId);

            try {
                await saveAllBooks(nextBooks, '礼金记录删除成功', currentBookIndex);
            } catch (error) {
                console.error(error);
                showToast(error.message || '删除失败', 'error');
            }
        }

        function setupEventListeners() {
            bookSelect.addEventListener('change', (event) => {
                currentBookIndex = parseInt(event.target.value, 10);
                resetEditingState();
                loadBook(currentBookIndex);
                filterRecords();
                syncClearButtons();
            });

            addBookBtn.addEventListener('click', () => openBookModal('create'));
            editBookBtn.addEventListener('click', () => {
                if (!getCurrentBook()) {
                    showToast('当前没有可编辑的大类', 'error');
                    return;
                }
                openBookModal('edit');
            });
            addRecordBtn.addEventListener('click', openRecordBatchModal);

            nameSearchInput.addEventListener('input', () => {
                nameClearBtn.classList.toggle('visible', nameSearchInput.value.length > 0);
                filterRecords();
            });

            nameClearBtn.addEventListener('click', () => {
                nameSearchInput.value = '';
                nameClearBtn.classList.remove('visible');
                nameSearchInput.focus();
                filterRecords();
            });

            amountSearchInput.addEventListener('input', () => {
                amountClearBtn.classList.toggle('visible', amountSearchInput.value.length > 0);
                filterRecords();
            });

            amountClearBtn.addEventListener('click', () => {
                amountSearchInput.value = '';
                amountClearBtn.classList.remove('visible');
                amountSearchInput.focus();
                filterRecords();
            });

            recordsSection.addEventListener('click', async (event) => {
                const recordActionBtn = event.target.closest('[data-record-action]');
                if (recordActionBtn) {
                    const action = recordActionBtn.dataset.recordAction;
                    const recordId = recordActionBtn.dataset.recordId;
                    const recordItemEl = recordActionBtn.closest('.record-item');

                    if (action === 'edit') {
                        startRecordEdit(recordId);
                    } else if (action === 'cancel') {
                        cancelRecordEdit();
                    } else if (action === 'save') {
                        await submitRecordEdit(recordId, recordItemEl);
                    } else if (action === 'delete') {
                        await deleteRecord(recordId);
                    }
                    return;
                }

                const viewAllBtn = event.target.closest('.view-all-btn');
                if (viewAllBtn) {
                    const name = viewAllBtn.dataset.name || '';
                    if (name) openAllRecordsModal(name);
                }
            });

            bookModalConfirm.addEventListener('click', submitBookModal);
            deleteBookBtn.addEventListener('click', deleteCurrentBook);
            bookModalCancel.addEventListener('click', closeBookModal);
            bookModalClose.addEventListener('click', closeBookModal);
            bookModal.addEventListener('click', (event) => {
                if (event.target === bookModal) closeBookModal();
            });

            recordBatchConfirm.addEventListener('click', submitBatchRecords);
            recordBatchCancel.addEventListener('click', closeRecordBatchModal);
            recordBatchModalClose.addEventListener('click', closeRecordBatchModal);
            recordBatchModal.addEventListener('click', (event) => {
                if (event.target === recordBatchModal) closeRecordBatchModal();
            });
            recordBatchAddRowBtn.addEventListener('click', () => {
                recordBatchRows.insertAdjacentHTML('beforeend', renderBatchRow());
            });
            recordBatchRows.addEventListener('click', (event) => {
                const removeBtn = event.target.closest('[data-action="remove-batch-row"]');
                if (!removeBtn) return;
                const row = removeBtn.closest('.batch-row');
                if (row) row.remove();
                ensureBatchRows();
            });

            allRecordsModalClose.addEventListener('click', closeAllRecordsModal);
            allRecordsModal.addEventListener('click', (event) => {
                if (event.target === allRecordsModal) closeAllRecordsModal();
            });

            document.addEventListener('keydown', (event) => {
                if (event.key !== 'Escape') return;
                if (allRecordsModal.classList.contains('open')) closeAllRecordsModal();
                if (bookModal.classList.contains('open')) closeBookModal();
                if (recordBatchModal.classList.contains('open')) closeRecordBatchModal();
            });

            sortButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.dataset.dir;
                    if (currentSortDirection === dir) {
                        currentSortDirection = 'none';
                        sortButtons.forEach(button => button.classList.remove('active'));
                    } else {
                        currentSortDirection = dir;
                        sortButtons.forEach(button => button.classList.remove('active'));
                        btn.classList.add('active');
                    }
                    filterRecords();
                    if (recordsSection) {
                        recordsSection.scrollTop = 0;
                    }
                });
            });
        }

        function loadBook(index) {
            if (!accountBooks.length) {
                bookInfo.textContent = '';
                recordsSection.innerHTML = '<div class="no-results">暂无礼金大类，请先新增</div>';
                statsTextEl.innerHTML = '暂无数据';
                updateAddRecordButton();
                return;
            }

            currentBookIndex = clampIndex(index, accountBooks.length);
            const book = accountBooks[currentBookIndex];
            bookInfo.innerHTML = `${escapeHtml(book.name)} ${getBookTypeBadgeHtml(book)}`;
            filteredRecords = [...book.records];
            bookSelect.value = String(currentBookIndex);
            updateAddRecordButton();
            displayRecords();
            updateStats();
        }

        function filterRecords() {
            const book = getCurrentBook();
            if (!book) {
                filteredRecords = [];
                displayRecords();
                updateStats();
                return;
            }

            const nameQuery = nameSearchInput.value.trim();
            const amountQuery = amountSearchInput.value.trim();
            let results = [...book.records];

            if (nameQuery) {
                results = results.filter(record =>
                    record.name.includes(nameQuery) || (record.note || '').includes(nameQuery)
                );
            }

            if (amountQuery) {
                const amount = Number(amountQuery);
                if (!Number.isNaN(amount)) {
                    results = results.filter(record => record.amount === amount);
                } else {
                    results = [];
                }
            }

            if (currentSortDirection === 'asc') {
                results.sort((a, b) => a.amount - b.amount);
            } else if (currentSortDirection === 'desc') {
                results.sort((a, b) => b.amount - a.amount);
            }

            filteredRecords = results;
            displayRecords();
            updateStats();
        }

        function getRecordDisplayHtml(record, isExpenseBook) {
            const noteHtml = record.note ? `<div class="record-note"><span class="record-note-type">备注</span>${escapeHtml(record.note)}</div>` : '';
            return `
                <div class="record-item ${isExpenseBook ? 'expense-record' : ''}" data-record-id="${record.id}">
                    <div class="record-main">
                        <div class="record-name">
                            <span>${escapeHtml(record.name)}</span>
                            <button type="button" class="view-all-btn" data-name="${escapeHtml(record.name)}">查看所有</button>
                        </div>
                        ${noteHtml}
                    </div>
                    <div class="record-side">
                        <div class="record-amount">${record.amount}元</div>
                        <div class="record-actions">
                            <button type="button" class="record-action-btn" data-record-action="edit" data-record-id="${record.id}">编辑</button>
                            <button type="button" class="record-action-btn danger" data-record-action="delete" data-record-id="${record.id}">删除</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function getRecordEditHtml(record, isExpenseBook) {
            return `
                <div class="record-item ${isExpenseBook ? 'expense-record' : ''}" data-record-id="${record.id}">
                    <div class="record-main">
                        <div class="record-edit-grid">
                            <div class="record-edit-field">
                                <label class="record-edit-label">名称</label>
                                <input type="text" class="record-edit-input" data-edit-field="name" value="${escapeHtml(record.name)}" placeholder="名称（必填）">
                            </div>
                            <div class="record-edit-field">
                                <label class="record-edit-label">备注</label>
                                <input type="text" class="record-edit-input" data-edit-field="note" value="${escapeHtml(record.note || '')}" placeholder="备注">
                            </div>
                            <div class="record-edit-field">
                                <label class="record-edit-label">金额</label>
                                <input type="number" class="record-edit-input" data-edit-field="amount" value="${record.amount}" placeholder="金额">
                            </div>
                        </div>
                    </div>
                    <div class="record-side">
                        <div class="record-actions">
                            <button type="button" class="record-action-btn success" data-record-action="save" data-record-id="${record.id}">确定修改</button>
                            <button type="button" class="record-action-btn" data-record-action="cancel" data-record-id="${record.id}">取消</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function displayRecords() {
            const book = getCurrentBook();
            if (!book) {
                recordsSection.innerHTML = '<div class="no-results">暂无礼金大类，请先新增</div>';
                return;
            }

            const isExpenseBook = getBookType(book) === 'expense';

            if (!filteredRecords.length) {
                recordsSection.innerHTML = '<div class="no-results">暂无匹配的记录</div>';
                return;
            }

            recordsSection.innerHTML = filteredRecords.map(record => {
                if (record.id === editingRecordId) {
                    return getRecordEditHtml(record, isExpenseBook);
                }
                return getRecordDisplayHtml(record, isExpenseBook);
            }).join('');
        }

        function updateStats() {
            const book = getCurrentBook();
            if (!book) {
                statsTextEl.innerHTML = '暂无数据';
                return;
            }
            const totalCount = book.records.length;
            const totalAmount = book.records.reduce((sum, record) => sum + (Number(record.amount) || 0), 0);
            statsTextEl.innerHTML = getStatsText(book, totalCount, totalAmount);
        }

        init().catch((error) => {
            console.error(error);
            showToast('初始化失败，请刷新后重试', 'error');
        });
    </script>
</body>
