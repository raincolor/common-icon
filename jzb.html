        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 8px;
            padding-bottom: 12px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 20px;
            text-align: center;
        }

        .book-selector {
            margin: 0;
        }

        .book-selector select {
            width: 100%;
            padding: 8px 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
        }

        .book-selector select option {
            background: #667eea;
            color: white;
        }

        .search-section {
            padding: 5px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .search-box {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .search-item {
            flex: 1;
            min-width: 0;
        }

        .search-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .search-label {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
            display: block;
            white-space: nowrap;
        }

        .search-input-wrap {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 32px 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 12px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #c0c4cc;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.2s;
            z-index: 2;
        }

        .clear-btn:hover {
            background: #909399;
        }

        .clear-btn.visible {
            display: flex;
        }

        .sort-buttons {
            display: flex;

            gap: 4px;
        }

        .sort-btn {
            border: 1px solid #e0e3ff;
            background: #f1f3ff;
            color: #667eea;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .sort-btn.active {
            background: #667eea;
            color: #ffffff;
        }

        .stats {
            padding: 5px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            text-align: center;
            font-size: 14px;
            color: #495057;
        }

        .stats-text {
            line-height: 1.5;
        }

        .stat-highlight {
            color: #667eea;
            font-weight: bold;
            font-size: 15px;
        }

        .records-section {
            padding: 10px 16px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .record-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .record-name {
            font-size: 16px;
            font-weight: 800;
            color: #06874f;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .view-all-btn {
            border: 1px solid #e0e3ff;
            background: #f1f3ff;
            color: #667eea;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .view-all-btn:hover {
            background: #e6e9ff;
        }

        .record-note {
            font-size: 14px;
            color: #399806;
            margin-bottom: 5px;
            display: block;
            white-space: nowrap;
            display: flex;
            align-items: center;

            .record-note-type {
                font-size: 12px;
                color: #6c757d;

                display: block;
                white-space: nowrap;
                padding-right: 2px;
            }
        }

        .record-amount {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .no-results {
            text-align: center;
            padding: 30px 20px;
            color: #6c757d;
            font-size: 16px;
        }

        .book-info {
            display: none;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 9999;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            color: #495057;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            background: #fff;
            cursor: pointer;
            color: #6c757d;
            font-size: 16px;
            line-height: 26px;
        }

        .modal-close:hover {
            background: #f1f3f5;
        }

        .modal-body {
            max-height: min(70vh, 520px);
            overflow: auto;
            padding: 12px 14px 14px;
        }

        .modal-empty {
            text-align: center;
            color: #6c757d;
            padding: 24px 8px;
        }

        .modal-book {
            margin-bottom: 10px;
            border: 1px solid #eef0f2;
            border-radius: 10px;
            overflow: hidden;
        }

        .modal-book-name {
            padding: 8px 10px;
            background: #f6f7ff;
            color: #667eea;
            font-weight: 700;
            font-size: 13px;
        }

        .modal-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-top: 1px solid #f0f1f3;
            font-size: 13px;
            color: #495057;
        }

        .modal-row-note {
            color: #6c757d;
            font-size: 12px;
        }

        /* 滚动条样式 */

            width: 6px;
        }

            background: #f1f1f1;
            border-radius: 10px;
        }

        .records-section::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

            background: #5568d3;
        }
    </style>
</head>

                    { "name": "钟传明", "amount": 600 },
                    { "name": "叶妹", "amount": 400 },
                    { "name": "薛哥", "amount": 1000 },
                    { "name": "曾维劲，曾维洪", "amount": 5000 },
                    { "name": "曾维英", "amount": 1200 },
                    { "name": "徐大福", "amount": 1000 },
                    { "name": "徐玉娇", "amount": 400 },
                    { "name": "丁长友", "amount": 1000 },
                    { "name": "丁大英", "amount": 400 },
                    { "name": "钟守员", "amount": 200 },
                ]
            },
            {
                name: '2014年7月7日 搬新居',
                records: [
                    { "name": "刘燕", "amount": 500 },
                    { "name": "欧武汉", "amount": 400 },
                    { "name": "王萍", "amount": 200 },
                    { "name": "刘光萍", "amount": 200,  },
                    { "name": "汪华菊", "amount": 400 },
                    { "name": "曾维贤", "amount": 200 },
                    { "name": "曾维智", "amount": 200 },
                    { "name": "严荣香", "amount": 800 },
                    { "name": "谢金元", "amount": 400 },
                    { "name": "钟守员", "amount": 600 },
                    { "name": "邓浩", "amount": 400 },
                    { "name": "曾维伦", "amount": 400 },
                    { "name": "曾维君", "amount": 200 },
                    { "name": "张大毛", "amount": 400 },
                    { "name": "曾秦", "amount": 200 },
                   
                ]
            },
            {name:'曾永春20岁生日',
                records: [
                { "name": "钟守员", "amount": 400, },
                ]
            }
        ];

        let currentBookIndex = 0;
        let filteredRecords = [];
        let currentSortDirection = 'none';

        // DOM 元素
        const bookSelect = document.getElementById('bookSelect');
        const bookInfo = document.getElementById('bookInfo');
        const nameSearchInput = document.getElementById('nameSearchInput');
        const amountSearchInput = document.getElementById('amountSearchInput');
        const nameClearBtn = document.getElementById('nameClearBtn');
        const amountClearBtn = document.getElementById('amountClearBtn');
        const recordsSection = document.getElementById('recordsSection');
        const totalCountEl = document.getElementById('totalCount');
        const totalAmountEl = document.getElementById('totalAmount');
        const statsTextEl = document.getElementById('statsText');
        const sortButtons = document.querySelectorAll('.sort-btn');
        const allRecordsModal = document.getElementById('allRecordsModal');
        const allRecordsModalTitle = document.getElementById('allRecordsModalTitle');
        const allRecordsModalBody = document.getElementById('allRecordsModalBody');
        const allRecordsModalClose = document.getElementById('allRecordsModalClose');

        // 初始化
        function init() {
            loadBook(currentBookIndex);
            setupEventListeners();
            syncClearButtons();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[m]));
        }

        function getAllRecordsByName(name) {
            const res = [];
            accountBooks.forEach((book, bookIndex) => {
                (book.records || []).forEach((r, recordIndex) => {
                    if (r && r.name === name) {
                        res.push({
                            bookIndex,
                            bookName: book.name,
                            recordIndex,
                            amount: r.amount,
                            note: r.note || ''
                        });
                    }
                });
            });
            return res;
        }

        function openAllRecordsModal(name) {
            const list = getAllRecordsByName(name);
            allRecordsModalTitle.textContent = `“${name}” 在所有人情的记录（共 ${list.length} 条）`;

            if (list.length === 0) {
                allRecordsModalBody.innerHTML = '<div class="modal-empty">暂无记录</div>';
            } else {
                // 按账本分组，且同名多条全部展示
                const groups = new Map();
                list.forEach(item => {
                    if (!groups.has(item.bookName)) groups.set(item.bookName, []);
                    groups.get(item.bookName).push(item);
                });

                const html = Array.from(groups.entries()).map(([bookName, items]) => {
                    const rows = items.map(it => {
                        const amountStr = (typeof it.amount === 'number') ? `${it.amount}元` : `${it.amount}元`;
                        const noteHtml = it.note ? `<div class="modal-row-note">备注：${escapeHtml(it.note)}</div>` : '';
                        return `
                            <div class="modal-row">
                                <div>
                                    <div>金额：${escapeHtml(amountStr)}</div>
                                    ${noteHtml}
                                </div>
                                <div>#${it.recordIndex + 1}</div>
                            </div>
                        `;
                    }).join('');
                    return `
                        <div class="modal-book">
                            <div class="modal-book-name">${escapeHtml(bookName)}</div>
                            ${rows}
                        </div>
                    `;
                }).join('');

                allRecordsModalBody.innerHTML = html;
            }

            allRecordsModal.classList.add('open');
            allRecordsModal.setAttribute('aria-hidden', 'false');
        }

        function closeAllRecordsModal() {
            allRecordsModal.classList.remove('open');
            allRecordsModal.setAttribute('aria-hidden', 'true');
        }

        function syncClearButtons() {
            if (nameClearBtn) {
                nameClearBtn.classList.toggle('visible', (nameSearchInput?.value || '').length > 0);
            }
            if (amountClearBtn) {
                amountClearBtn.classList.toggle('visible', (amountSearchInput?.value || '').length > 0);
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 账本切换
            bookSelect.addEventListener('change', (e) => {
                currentBookIndex = parseInt(e.target.value);
                loadBook(currentBookIndex);
                // nameSearchInput.value = '';
                // amountSearchInput.value = '';
                filterRecords();
                syncClearButtons();
            });

            // 姓名搜索输入
            nameSearchInput.addEventListener('input', () => {
                nameClearBtn.classList.toggle('visible', nameSearchInput.value.length > 0);
                filterRecords();
            });

            // 姓名清除按钮
            nameClearBtn.addEventListener('click', () => {
                nameSearchInput.value = '';
                nameClearBtn.classList.remove('visible');
                nameSearchInput.focus();
                filterRecords();
            });

            // 金额搜索输入
            amountSearchInput.addEventListener('input', () => {
                amountClearBtn.classList.toggle('visible', amountSearchInput.value.length > 0);
                filterRecords();
            });

            // 金额清除按钮
            amountClearBtn.addEventListener('click', () => {
                amountSearchInput.value = '';
                amountClearBtn.classList.remove('visible');
                amountSearchInput.focus();
                filterRecords();
            });

            // 查看所有（事件委托）
            recordsSection.addEventListener('click', (e) => {
                const btn = e.target.closest('.view-all-btn');
                if (!btn) return;
                const name = btn.dataset.name || '';
                if (!name) return;
                openAllRecordsModal(name);
            });

            // 弹窗关闭：按钮 / 点击遮罩 / Esc
            allRecordsModalClose.addEventListener('click', closeAllRecordsModal);
            allRecordsModal.addEventListener('click', (e) => {
                if (e.target === allRecordsModal) closeAllRecordsModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && allRecordsModal.classList.contains('open')) {
                    closeAllRecordsModal();
                }
            });

            // 金额排序按钮
            sortButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.dataset.dir;
                    if (currentSortDirection === dir) {
                        // 再次点击同一个按钮，取消排序
                        currentSortDirection = 'none';
                        sortButtons.forEach(b => b.classList.remove('active'));
                    } else {
                        currentSortDirection = dir;
                        sortButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    }
                    filterRecords();
                });
            });
        }

        // 加载账本
        function loadBook(index) {
            const book = accountBooks[index];
            bookInfo.textContent = book.name;
            filteredRecords = [...book.records];
            displayRecords();
            updateStats();
        }

        // 过滤记录
        function filterRecords() {
            const book = accountBooks[currentBookIndex];
            const nameQuery = nameSearchInput.value.trim();
            const amountQuery = amountSearchInput.value.trim();

            let results = [...book.records];

            // 姓名模糊搜索
            if (nameQuery) {
                results = results.filter(record =>
                    record.name.includes(nameQuery)
                );
            }

            // 金额精确搜索
            if (amountQuery) {
                const amount = parseFloat(amountQuery);
                if (!isNaN(amount)) {
                    results = results.filter(record =>
                        record.amount === amount
                    );
                } else {
                    results = [];
                }
            }

            // 金额排序
            if (currentSortDirection === 'asc') {
                results.sort((a, b) => a.amount - b.amount);
            } else if (currentSortDirection === 'desc') {
                results.sort((a, b) => b.amount - a.amount);
            }

            filteredRecords = results;
            displayRecords();
            updateStats();
        }

        // 显示记录
        function displayRecords() {
            if (filteredRecords.length === 0) {
                recordsSection.innerHTML = '<div class="no-results">暂无匹配的记录</div>';
                return;
            }

            recordsSection.innerHTML = filteredRecords
                .map(record => record.note && record.note.length > 0 ? `
                    <div class="record-item">
                        <div class="record-name">
                            <span>${record.name}</span>
                            <button type="button" class="view-all-btn" data-name="${escapeHtml(record.name)}">查看所有</button>
                        </div>
                         <div class="record-note"><span class="record-note-type"> 送</span> ${record?.note}</div>
                        <div class="record-amount">${record.amount}元</div>
                    </div>
                `: `
                    <div class="record-item">
                        <div class="record-name">
                            <span>${record.name}</span>
                            <button type="button" class="view-all-btn" data-name="${escapeHtml(record.name)}">查看所有</button>
                        </div>
                        <div class="record-amount">${record.amount}元</div>
                    </div>
                `)
                .join('');
        }

        // 更新统计信息
        function updateStats() {
            const book = accountBooks[currentBookIndex];
            const totalCount = book.records.length;
            const totalAmount = book.records.reduce((sum, record) => sum + record.amount, 0);

            totalCountEl.textContent = totalCount;
            totalAmountEl.textContent = totalAmount.toFixed(2);
        }

        // 启动应用
        init();
    </script>
</body>

</html>
